name: Auto-format X3 BLE PR branch

on:
  push:
    branches: [fix/x3-ble-stability]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/x3-ble-stability
      - name: Install clang-format-21
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-21 >/dev/null
      - name: Format changed source and remove helper workflow
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" clang-format-21 -style=file -i src/activities/reader/EpubReaderActivity.cpp
          git rm .github/workflows/auto-format-x3-ble.yml
          git config user.name "Sliff2000"
          git config user.email "cjbriere@c-itsolutions.com"
          git add src/activities/reader/EpubReaderActivity.cpp
          git commit -m "style: apply clang-format to X3 BLE stability fix"
          git push origin HEAD:fix/x3-ble-stability
