name: Build optimized X3 BLE firmware

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/build-x3-ble-optimized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x3-ble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BLE source
        uses: actions/checkout@v6
        with:
          repository: crosspoint-reader/crosspoint-reader
          ref: 869b01e909c622989988db595b7ac8672cbfb100
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Apply X3 BLE memory tuning
        run: |
          set -euo pipefail
          sed -i 's/CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=6/CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=6/CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_ACL_BUF_COUNT=6/CONFIG_BT_NIMBLE_ACL_BUF_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=12/CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=8/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=6/CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=12/CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=8/' platformio.ini
          sed -i 's/CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=50/CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=20/' platformio.ini
          sed -i 's/CONFIG_BT_CTRL_ADV_DUP_FILT_MAX=10/CONFIG_BT_CTRL_ADV_DUP_FILT_MAX=6/' platformio.ini

      - name: Prime custom Arduino framework rebuild
        run: |
          set +e
          pio run -e gh_release > bootstrap.log 2>&1
          rc=$?
          set -e
          echo "bootstrap exit=$rc (a first-pass link failure is expected)"
          tail -80 bootstrap.log

      - name: Reapply BLE weak-symbol patch after framework rebuild
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          roots = list(Path.home().glob('.platformio/packages/framework-arduinoespressif32/cores/esp32/esp32-hal-bt-mem.h'))
          if not roots:
              raise SystemExit('esp32-hal-bt-mem.h not found')
          p = roots[0]
          s = p.read_text()
          old = 'extern bool _btLibraryInUse;'
          new = '__attribute__((weak)) bool _btLibraryInUse = false;  /* CrossPoint CI post-rebuild patch */'
          if new not in s:
              if old not in s:
                  raise SystemExit('expected _btLibraryInUse declaration not found')
              p.write_text(s.replace(old, new))
          print(p)
          print([line for line in p.read_text().splitlines() if '_btLibraryInUse' in line])
          PY

      - name: Build release firmware
        run: |
          set -euo pipefail
          pio run -e gh_release | tee pio.log

      - name: Symbolize latest X3 crash
        run: |
          set -euo pipefail
          ADDR2LINE="$(find ~/.platformio/packages -type f -name 'riscv32-esp-elf-addr2line' | head -1)"
          "$ADDR2LINE" -pfiaC -e .pio/build/gh_release/firmware.elf \
            0x421eda47 0x421eda4a 0x421eda96 0x421ed08a 0x421edce4 0x421edd0e \
            0x4209f73a 0x42095266 0x4204723a 0x42095524 0x4209b506 0x42051aca \
            0x4209c0a4 0x420ede2e 0x420cd370 | tee symbolized-crash.txt

      - name: Upload X3 BLE firmware and symbols
        uses: actions/upload-artifact@v6
        with:
          name: x3-ble-optimized-firmware
          path: |
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            symbolized-crash.txt
          if-no-files-found: error
