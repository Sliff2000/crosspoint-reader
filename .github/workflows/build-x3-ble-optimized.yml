name: Build optimized X3 BLE firmware

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/build-x3-ble-optimized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x3-ble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BLE source
        uses: actions/checkout@v6
        with:
          repository: crosspoint-reader/crosspoint-reader
          ref: 869b01e909c622989988db595b7ac8672cbfb100
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Apply X3 BLE memory tuning
        run: |
          set -euo pipefail
          sed -i 's/CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=6/CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=6/CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_ACL_BUF_COUNT=6/CONFIG_BT_NIMBLE_ACL_BUF_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=12/CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=8/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=6/CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=12/CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=8/' platformio.ini
          sed -i 's/CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=50/CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=20/' platformio.ini
          sed -i 's/CONFIG_BT_CTRL_ADV_DUP_FILT_MAX=10/CONFIG_BT_CTRL_ADV_DUP_FILT_MAX=6/' platformio.ini

      - name: Patch active-build and render OOM paths
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/activities/reader/EpubReaderActivity.cpp')
          s = p.read_text()

          needle = '    auto p = section->loadPage(section->currentPage);\n'
          insert = (
              '    // An active incremental build keeps parser/CSS state resident. Lend the\n'
              '    // framebuffer before page deserialization so BLE + build state cannot\n'
              '    // exhaust the C3 heap inside TextBlock allocation.\n'
              '    if (section->isBuilding()) {\n'
              '      LOG_INF("ERS", "Active build page load: lending framebuffer (ble=%u heap=%u maxAlloc=%u)",\n'
              '              BleHid.isRunning() ? 1 : 0, (unsigned)ESP.getFreeHeap(), (unsigned)ESP.getMaxAllocHeap());\n'
              '      buildLoan.release();\n'
              '    }\n'
          )
          if s.count(needle) != 1:
              raise SystemExit(f'expected exactly one page-load target, found {s.count(needle)}')
          s = s.replace(needle, insert + needle, 1)

          old = '''  const auto restoreFramebufferForDraw = [&buildLoan]() {
    if (!buildLoan.restore()) {
      ESP.restart();
      return false;
    }
    return true;
  };
'''
          new = '''  const auto restoreFramebufferForDraw = [&buildLoan]() {
    if (!buildLoan.restore()) {
      ESP.restart();
      return false;
    }
    // The framebuffer may restore successfully yet leave too little general heap
    // for FontCacheManager::recordText()/std::string allocations. That was the
    // field crash after several BLE page turns (11 KB free / 4.6 KB max block).
    // Shed BLE before rendering when either floor is violated; lifecycle code can
    // restart it later once the heap recovers.
    if (BleHid.isRunning() &&
        (ESP.getFreeHeap() < RENDER_MIN_FREE_HEAP || ESP.getMaxAllocHeap() < BACKGROUND_BUILD_MIN_MAX_ALLOC)) {
      LOG_INF("ERS", "Render heap low after framebuffer restore; freeing BLE (heap=%u maxAlloc=%u)",
              (unsigned)ESP.getFreeHeap(), (unsigned)ESP.getMaxAllocHeap());
      bleinput::stop();
    }
    return true;
  };
'''
          if old not in s:
              raise SystemExit('restoreFramebufferForDraw patch target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build release firmware
        run: |
          set -euo pipefail
          pio run -e gh_release | tee pio.log

      - name: Symbolize latest X3 crash
        run: |
          set -euo pipefail
          ADDR2LINE="$(find ~/.platformio/packages -type f -name 'riscv32-esp-elf-addr2line' | head -1)"
          "$ADDR2LINE" -pfiaC -e .pio/build/gh_release/firmware.elf \
            0x421eda9b 0x421eda9e 0x421edaea 0x421edc0c 0x421f0aa2 0x421edd56 \
            0x420511dc 0x42054e0a 0x4209f1c4 0x42094a58 0x420ea558 0x4204702c \
            0x42051af0 0x420e8a40 0x421386b0 0x420edfda 0x420dddca | tee symbolized-crash.txt

      - name: Upload X3 BLE firmware and symbols
        uses: actions/upload-artifact@v6
        with:
          name: x3-ble-optimized-firmware
          path: |
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            symbolized-crash.txt
          if-no-files-found: error
