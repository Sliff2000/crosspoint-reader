name: Build optimized X3 BLE firmware

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/build-x3-ble-optimized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x3-ble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BLE source
        uses: actions/checkout@v6
        with:
          repository: crosspoint-reader/crosspoint-reader
          ref: 869b01e909c622989988db595b7ac8672cbfb100
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Apply X3 BLE memory tuning
        run: |
          set -euo pipefail
          sed -i 's/CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=6/CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=6/CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_ACL_BUF_COUNT=6/CONFIG_BT_NIMBLE_ACL_BUF_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=12/CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=8/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=6/CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=4/' platformio.ini
          sed -i 's/CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=12/CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=8/' platformio.ini
          sed -i 's/CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=50/CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=20/' platformio.ini
          sed -i 's/CONFIG_BT_CTRL_ADV_DUP_FILT_MAX=10/CONFIG_BT_CTRL_ADV_DUP_FILT_MAX=6/' platformio.ini

      - name: Patch X3 BLE reader memory safeguards
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          h = Path('src/activities/reader/EpubReaderActivity.h')
          hs = h.read_text()
          replacements = {
              '  static constexpr int BUILD_PAGES_PER_CHUNK = 8;': '  static constexpr int BUILD_PAGES_PER_CHUNK = 4;',
              '  static constexpr int BACKGROUND_BUILD_PAGES_PER_TICK = 2;': '  static constexpr int BACKGROUND_BUILD_PAGES_PER_TICK = 1;',
              '  static constexpr size_t BACKGROUND_BUILD_MIN_FREE_HEAP = 26 * 1024;': '  static constexpr size_t BACKGROUND_BUILD_MIN_FREE_HEAP = 34 * 1024;',
              '  static constexpr size_t BACKGROUND_BUILD_MIN_MAX_ALLOC = 13 * 1024;': '  static constexpr size_t BACKGROUND_BUILD_MIN_MAX_ALLOC = 20 * 1024;',
              '  static constexpr size_t RENDER_MIN_FREE_HEAP = 24 * 1024;': '  static constexpr size_t RENDER_MIN_FREE_HEAP = 30 * 1024;',
              '  static constexpr int BUILD_WINDOW_AHEAD = 5;': '  static constexpr int BUILD_WINDOW_AHEAD = 4;',
          }
          for old, new in replacements.items():
              if old not in hs:
                  raise SystemExit(f'header patch target missing: {old}')
              hs = hs.replace(old, new, 1)
          h.write_text(hs)

          p = Path('src/activities/reader/EpubReaderActivity.cpp')
          s = p.read_text()

          # Before deserializing a page, stop background parsing and lend the
          # framebuffer when heap/maxAlloc is tight. BLE stays connected.
          needle = '    auto p = section->loadPage(section->currentPage);\n'
          insert = (
              '    if (section->isBuilding()) {\n'
              '      section->suspendBuild();\n'
              '    }\n'
              '    if (ESP.getFreeHeap() < RENDER_MIN_FREE_HEAP ||\n'
              '        ESP.getMaxAllocHeap() < BACKGROUND_BUILD_MIN_MAX_ALLOC) {\n'
              '      buildLoan.release();\n'
              '    }\n'
          )
          if s.count(needle) != 1:
              raise SystemExit(f'page load target mismatch: {s.count(needle)}')
          s = s.replace(needle, insert + needle, 1)

          # Restoring the framebuffer may still shed BLE internally if allocation
          # actually fails, but low heap alone no longer disconnects BLE.
          old = (
              '  const auto restoreFramebufferForDraw = [&buildLoan]() {\n'
              '    if (!buildLoan.restore()) {\n'
              '      ESP.restart();\n'
              '      return false;\n'
              '    }\n'
              '    return true;\n'
              '  };\n'
          )
          new = (
              '  const auto restoreFramebufferForDraw = [this, &buildLoan]() {\n'
              '    if (!buildLoan.restore()) {\n'
              '      ESP.restart();\n'
              '      return false;\n'
              '    }\n'
              '    if ((ESP.getFreeHeap() < RENDER_MIN_FREE_HEAP ||\n'
              '         ESP.getMaxAllocHeap() < BACKGROUND_BUILD_MIN_MAX_ALLOC) &&\n'
              '        section && section->isBuilding()) {\n'
              '      section->suspendBuild();\n'
              '    }\n'
              '    return true;\n'
              '  };\n'
          )
          if old not in s:
              raise SystemExit('restore target mismatch')
          s = s.replace(old, new, 1)

          # With BLE active, maintain only a four-page read-ahead watermark.
          old = (
              '  if (section && !section->isBuilding() && section->isPartial() && !RenderLock::peek() && buildViewportWidth > 0 &&\n'
              '      !partialRebuildStartFailed &&\n'
              '      section->currentPage + PARTIAL_REBUILD_START_MARGIN >= static_cast<int>(section->pageCount)) {\n'
          )
          new = (
              '  const int partialResumeMargin = BleHid.isRunning() ? 4 : PARTIAL_REBUILD_START_MARGIN;\n'
              '  if (section && !section->isBuilding() && section->isPartial() && !RenderLock::peek() && buildViewportWidth > 0 &&\n'
              '      !partialRebuildStartFailed &&\n'
              '      section->currentPage + partialResumeMargin >= static_cast<int>(section->pageCount)) {\n'
          )
          if old not in s:
              raise SystemExit('partial condition mismatch')
          s = s.replace(old, new, 1)

          # Background read-ahead is optional work. If the heap is fragmented,
          # pause it instead of disconnecting BLE just to continue prebuilding.
          old = (
              '  if (BleHid.isRunning()) {\n'
              '    LOG_INF("ERS", "Background build needs heap (free=%u maxAlloc=%u); freeing BLE RAM", (unsigned)freeHeap,\n'
              '            (unsigned)maxBlock);\n'
              '    bleinput::stop();\n'
              '  }\n'
              '  buildHeapPaused = true;\n'
              '  return false;\n'
          )
          new = (
              '  if (BleHid.isRunning()) {\n'
              '    LOG_INF("ERS", "Background build paused for heap (free=%u maxAlloc=%u); keeping BLE connected",\n'
              '            (unsigned)freeHeap, (unsigned)maxBlock);\n'
              '  }\n'
              '  buildHeapPaused = true;\n'
              '  return false;\n'
          )
          if old not in s:
              raise SystemExit('background heap gate target mismatch')
          s = s.replace(old, new, 1)

          # Never draw the indexing popup while BLE reading. At the partial-cache
          # boundary, silently extend the cache with the framebuffer loaned instead.
          old = (
              '  if (section->isPartial() && section->currentPage >= static_cast<int>(section->pageCount)) {\n'
              '    GUI.drawPopup(renderer, tr(STR_INDEXING));\n'
              '    pagesUntilFullRefresh = 1;\n'
              '  }\n'
          )
          new = (
              '  if (section->isPartial() && section->currentPage >= static_cast<int>(section->pageCount) &&\n'
              '      !BleHid.isRunning() && renderer.hasFrameBuffer()) {\n'
              '    GUI.drawPopup(renderer, tr(STR_INDEXING));\n'
              '    pagesUntilFullRefresh = 1;\n'
              '  }\n'
          )
          if old not in s:
              raise SystemExit('indexing popup target mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Build release firmware
        run: |
          set -euo pipefail
          pio run -e gh_release | tee pio.log

      - name: Upload X3 BLE firmware and symbols
        uses: actions/upload-artifact@v6
        with:
          name: x3-ble-optimized-firmware
          path: |
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
          if-no-files-found: error
